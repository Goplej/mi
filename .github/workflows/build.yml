name: build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'

jobs:
  build:
    name: gradlew build (JDK 8)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Probe the Forge maven
        continue-on-error: true
        run: |
          {
            base=https://maven.minecraftforge.net/net/minecraftforge/forge
            for v in 1.12.2-14.23.5.2859 1.12.2-14.23.5.2860 1.12.2-14.23.5.2847 1.12.2-14.23.5.2768; do
              for suffix in -userdev.jar -userdev.zip -universal.jar .jar .pom -src.zip; do
                url="$base/$v/forge-$v$suffix"
                printf '%s  %s\n' "$(curl -sS -o /dev/null -m 20 -w '%{http_code}' "$url" || echo ERR)" "$url"
              done
            done
            echo '--- directory listing: 1.12.2-14.23.5.2859 ---'
            curl -sSL -m 25 "$base/1.12.2-14.23.5.2859/" || true
            echo '--- directory listing: 1.12.2-14.23.5.2860 ---'
            curl -sSL -m 25 "$base/1.12.2-14.23.5.2860/" || true
            echo '--- maven-metadata.xml (1.12.2 tail) ---'
            curl -sSL -m 25 "$base/maven-metadata.xml" | tail -40 || true
            echo '--- other hosts ---'
            for url in \
              https://files.minecraftforge.net/maven/net/minecraftforge/forge/1.12.2-14.23.5.2859/forge-1.12.2-14.23.5.2859-userdev.jar \
              https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml \
              https://libraries.minecraft.net/net/minecraft/client/1.12.2/client-1.12.2.jar \
              https://piston-data.mojang.com/mc/game/version_manifest.json ; do
              printf '%s  %s\n' "$(curl -sS -o /dev/null -m 20 -w '%{http_code}' "$url" || echo ERR)" "$url"
            done
            echo '--- done ---'
          } 2>&1 | tee ci-probe.log

      - name: Build
        id: build
        continue-on-error: true
        run: |
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee ci-build.log
          exit ${PIPESTATUS[0]}

      - name: List output
        if: always()
        run: ls -l build/libs || true

      # The Actions log endpoints are not reachable from every environment, so the
      # build log is committed back to the branch and can be read with a normal git pull.
      - name: Publish build log
        if: always()
        run: |
          {
            echo "=== probe ($GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT) ==="
            tail -c 30000 ci-probe.log 2>/dev/null
            echo
            echo "=== build ==="
            tail -c 60000 ci-build.log 2>/dev/null
          } > ci-last-build.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ci-last-build.log
          git commit -m 'ci: build log [skip ci]' || true
          git push origin HEAD:${GITHUB_REF_NAME} || true

      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ScriptCraft-jar
          path: build/libs/ScriptCraft-*.jar
          if-no-files-found: error
