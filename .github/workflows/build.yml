name: build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'

jobs:
  build:
    name: gradlew build (JDK 8)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Probe the toolchain hosts
        continue-on-error: true
        run: |
          {
            echo '--- mojang ---'
            meta=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json
            printf '%s  %s\n' "$(curl -sS -o /dev/null -m 20 -w '%{http_code}' "$meta" || echo ERR)" "$meta"
            vurl=$(curl -sSL -m 25 "$meta" | python3 -c "import sys,json;d=json.load(sys.stdin);print([v['url'] for v in d['versions'] if v['id']=='1.12.2'][0])" 2>/dev/null || true)
            echo "1.12.2 version json: $vurl"
            if [ -n "$vurl" ]; then
              curl -sSL -m 25 "$vurl" | python3 -c "import sys,json;d=json.load(sys.stdin);[print(k,v.get('url'),v.get('size')) for k,v in d['downloads'].items() if isinstance(v,dict)]" 2>/dev/null || true
            fi
            echo '--- forge maven, per build ---'
            base=https://maven.minecraftforge.net/net/minecraftforge/forge
            for v in 1.12.2-14.23.5.2847 1.12.2-14.23.5.2859; do
              printf '%s  %s\n' "$(curl -sS -o /dev/null -m 20 -w '%{http_code}' "$base/$v/forge-$v-userdev.jar" || echo ERR)" "$base/$v/forge-$v-userdev.jar"
            done
            echo '--- third party mirror that may still have 2859 userdev ---'
            for url in \
              https://maven.cleanroommc.com/net/minecraftforge/forge/1.12.2-14.23.5.2859/forge-1.12.2-14.23.5.2859-userdev.jar \
              https://maven.cleanroommc.com/net/minecraftforge/forge/maven-metadata.xml ; do
              printf '%s  %s\n' "$(curl -sS -o /dev/null -m 20 -w '%{http_code}' "$url" || echo ERR)" "$url"
            done
            echo '--- done ---'
          } 2>&1 | tee ci-probe.log

      - name: Build
        id: build
        continue-on-error: true
        run: |
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee ci-build.log
          exit ${PIPESTATUS[0]}

      - name: List output
        if: always()
        run: ls -l build/libs || true

      # The Actions log endpoints are not reachable from every environment, so the build
      # log (and the jar itself) are committed back to the branch and can be picked up
      # with a normal git pull. Nothing here is needed by the mod at runtime.
      - name: Publish build log and jar
        if: always()
        run: |
          {
            echo "=== probe ($GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT) ==="
            tail -c 20000 ci-probe.log 2>/dev/null
            echo
            echo "=== build ==="
            tail -c 60000 ci-build.log 2>/dev/null
          } > ci-last-build.log

          if [ -d build/libs ] && ls build/libs/ScriptCraft-*.jar >/dev/null 2>&1; then
            mkdir -p dist
            cp build/libs/ScriptCraft-*.jar dist/
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ci-last-build.log
          if [ -d dist ]; then git add -f dist; fi
          git commit -m 'ci: build log and jar [skip ci]' || true
          git push origin HEAD:${GITHUB_REF_NAME} || true

      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ScriptCraft-jar
          path: build/libs/ScriptCraft-*.jar
          if-no-files-found: error
