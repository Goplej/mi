name: build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish build/libs as a GitHub release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'

jobs:
  build:
    name: gradlew build (JDK 8)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      # Informational only - a flake here must not block the build.
      - name: Toolchain versions
        continue-on-error: true
        run: |
          java -version
          ./gradlew --version

      - name: Build
        id: build
        run: |
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee ci-build.log
          exit ${PIPESTATUS[0]}

      - name: List output
        if: always()
        run: ls -l build/libs || true

      # Proves the file Gradle produced really is a reobfuscated Forge 1.12.2 mod jar and not
      # just something that happens to be named ScriptCraft-0.1.0.jar. The dumps go to files
      # first: `javap ... | grep -q ...` under `set -o pipefail` can die of SIGPIPE, and javap 8
      # prints annotation values abbreviated (#7=e#8.#9) where javap 11 expands them, so the
      # checks below only look at things both versions print the same way.
      - name: Verify the built jar
        id: verify
        run: |
          set -uo pipefail
          exec > >(tee -a ci-verify.log) 2>&1
          echo "javap: $(command -v javap) $(javap -version 2>&1 | head -1)"

          jar=build/libs/ScriptCraft-0.1.0.jar
          test -f "$jar" || { echo "no jar at $jar"; exit 1; }

          d=$(mktemp -d)
          unzip -l "$jar" > "$d/list.txt"
          unzip -p "$jar" META-INF/MANIFEST.MF > "$d/manifest.txt"
          unzip -p "$jar" mcmod.info > "$d/mcmod.txt"
          javap -verbose -cp "$jar" com.scriptcraft.ScriptCraft > "$d/mod.txt" 2>&1
          javap -verbose -cp "$jar" com.scriptcraft.client.ClientProxy > "$d/client.txt" 2>&1
          javap -c -p -cp "$jar" com.scriptcraft.api.PlayerApi > "$d/player.txt" 2>&1

          failures=0
          check() {
            if eval "$2" >/dev/null 2>&1; then
              echo "ok       $1"
            else
              echo "FAILED   $1"
              echo "::warning title=Jar check failed::$1"
              failures=$((failures + 1))
            fi
          }

          check 'manifest names the mod'            "grep -q 'Implementation-Title: ScriptCraft' $d/manifest.txt"
          check 'mcmod.info declares mcversion'     "grep -q mcversion $d/mcmod.txt && grep -q 1.12.2 $d/mcmod.txt"
          check 'bundled example is packaged'       "grep -q 'assets/scriptcraft/examples/example.js' $d/list.txt"
          classes=$(grep -c '\.class$' "$d/list.txt")
          check 'at least 50 classes'               "[ $classes -ge 50 ]"
          check 'class files are Java 8 (major 52)' "grep -q 'major version: 52' $d/mod.txt"
          check 'links against FML (@Mod)'          "grep -q 'net/minecraftforge/fml/common/Mod' $d/mod.txt"
          check 'client proxy is @SideOnly(CLIENT)' "grep -q SideOnly $d/client.txt && grep -q CLIENT $d/client.txt"
          check 'reobfuscated (SRG names present)'  "grep -qE 'func_[0-9a-z]+' $d/player.txt"
          check 'the two-script-folder fix is in'   "unzip -p $jar com/scriptcraft/filesystem/ScriptFileManager.class | grep -q 'scriptcraft/scripts and scriptcraft'"

          echo "::notice title=Built jar::$jar - $(stat -c%s "$jar") bytes, $classes classes, sha256 $(sha256sum "$jar" | cut -c1-32)"

          if [ "$failures" != 0 ]; then
            echo "$failures check(s) failed; dumps follow"
            for f in client.txt mod.txt player.txt; do
              echo "--- $f ---"
              head -40 "$d/$f"
            done
            exit 1
          fi
          echo 'the jar is a real, reobfuscated Forge 1.12.2 mod jar'

      # The Actions artifact download goes through a host that is not reachable from every
      # environment, so the jar is also committed to release/ and can be picked up with a pull.
      - name: Publish the jar
        if: github.ref_type == 'branch'
        run: |
          # Both tracked copies are kept in sync: build/libs (where gradlew writes) and release/
          # (which survives gradlew clean). reobfJar stamps entries with the build time, so the
          # comparison is on content - entry names and CRCs - not on file bytes.
          fingerprint() { unzip -v "$1" | awk 'NR>3 {print $7, $8}' | sort; }

          mkdir -p release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for built in build/libs/ScriptCraft-*.jar; do
            name=$(basename "$built")

            reference=
            for candidate in "build/libs/$name" "release/$name"; do
              if git cat-file -e "HEAD:$candidate" 2>/dev/null; then
                reference="$candidate"
              fi
            done

            if [ -n "$reference" ] && git show "HEAD:$reference" > /tmp/tracked.jar \
               && [ "$(fingerprint "$built")" = "$(fingerprint /tmp/tracked.jar)" ]; then
              echo "$name: build output matches what is tracked, keeping the tracked bytes"
              cp /tmp/tracked.jar "$built"
              for target in "build/libs/$name" "release/$name"; do
                if git cat-file -e "HEAD:$target" 2>/dev/null; then
                  # both copies have to carry the same jar; this is a no-op once they do
                  cp /tmp/tracked.jar "$target"
                  git add -f "$target"
                fi
              done
            else
              echo "$name: content changed (or new), publishing"
              cp "$built" "release/$name"
              git add -f "$built" "release/$name"
            fi
          done

          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m 'ci: built jar [skip ci]'
          git push origin HEAD:refs/heads/${GITHUB_REF_NAME} || true

      # Same JDK 8 and the same Nashorn the mod uses at runtime.
      - name: Offline verification rig
        run: |
          set +e
          ./dev-verify/verify.sh 2>&1 | tee ci-verify.log
          status=${PIPESTATUS[0]}
          javac -version 2>&1 | sed 's/^/::notice title=Rig toolchain::/'
          grep -E 'PASSED:' ci-verify.log | tail -1 | sed 's/^/::notice title=Rig result::/'
          exit $status

      # The Actions log endpoints are not reachable from every environment either. On failure
      # the logs are committed back so they can be read with a normal git pull.
      - name: Publish the build log
        if: failure()
        run: |
          {
            echo "=== run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT on ${GITHUB_REF_NAME} (${GITHUB_REF_TYPE}) ==="
            echo "build: ${{ steps.build.outcome }}   jar checks: ${{ steps.verify.outcome }}"
            for f in ci-verify.log ci-build.log; do
              echo "--- $f ---"
              if [ -f "$f" ]; then tail -c 40000 "$f"; else echo '(missing)'; fi
            done
          } > ci-last-build.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ci-last-build.log
          git commit -m 'ci: build log [skip ci]' || true
          # always onto a branch, never onto the tag that may have triggered this run
          target="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then target=arena/01a0c3ee-mi; fi
          git push origin HEAD:refs/heads/$target || true

      - name: Upload jar
        uses: actions/upload-artifact@v6
        with:
          name: ScriptCraft-jar
          path: build/libs/ScriptCraft-*.jar
          if-no-files-found: error

      # Release assets are uploaded through uploads.github.com, which some environments cannot
      # reach; this step runs on the runner instead, so the release always gets its assets.
      - name: Publish the release
        if: github.ref_type == 'tag' || github.event.inputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(grep -oE "version = '[0-9.]+'" build.gradle | head -1 | cut -d"'" -f2)
          tag="${GITHUB_REF_NAME}"
          case "$tag" in v*[0-9]) ;; *) tag="v$version" ;; esac

          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true

          args="build/libs/ScriptCraft-*.jar --title ScriptCraft-$version --notes-file RELEASE_NOTES.md"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            # The tag that triggered this run already exists.
            gh release create "$tag" $args
          else
            gh release create "$tag" $args --target "${GITHUB_SHA}"
          fi

          gh release view "$tag" --json url,assets --jq '"release \(.url) assets: \([.assets[].name] | join(", "))"'
