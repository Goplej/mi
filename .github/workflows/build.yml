name: build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'

jobs:
  build:
    name: gradlew build (JDK 8)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Build
        id: build
        continue-on-error: true
        run: |
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee ci-build.log
          exit ${PIPESTATUS[0]}

      - name: List output
        if: always()
        run: ls -l build/libs || true

      # Proves the file Gradle produced really is a reobfuscated Forge 1.12.2 mod jar and not
      # just something that happens to be named ScriptCraft-0.1.0.jar.
      - name: Verify the built jar
        if: steps.build.outcome == 'success'
        run: |
          set -uo pipefail
          jar=build/libs/ScriptCraft-0.1.0.jar
          test -f "$jar" || { echo "no jar at $jar"; exit 1; }

          failures=0
          check() {
            if eval "$2" >/dev/null 2>&1; then
              echo "ok       $1"
            else
              echo "FAILED   $1"
              failures=$((failures + 1))
            fi
          }

          check 'manifest names the mod'          "unzip -p $jar META-INF/MANIFEST.MF | grep -q 'Implementation-Title: ScriptCraft'"
          check 'mcmod.info declares mcversion'   "unzip -p $jar mcmod.info | grep -q mcversion && unzip -p $jar mcmod.info | grep -q 1.12.2"
          check 'bundled example is packaged'     "unzip -l $jar | grep -q 'assets/scriptcraft/examples/example.js'"
          check 'at least 50 classes'             "test \$(unzip -l $jar | grep -c '\.class$') -ge 50"
          check 'class files are Java 8 (major 52)' "javap -verbose -cp $jar com.scriptcraft.ScriptCraft | grep -q 'major version: 52'"
          check 'links against FML (@Mod)'        "javap -verbose -cp $jar com.scriptcraft.ScriptCraft | grep -q 'net/minecraftforge/fml/common/Mod'"
          check 'client proxy is @SideOnly(CLIENT)' "javap -verbose -cp $jar com.scriptcraft.client.ClientProxy | grep -q 'Lnet/minecraftforge/fml/relauncher/Side;.CLIENT'"
          check 'reobfuscated (SRG names present)' "javap -c -p -cp $jar com.scriptcraft.api.PlayerApi | grep -qE 'func_[0-9a-z]+'"

          classes=$(unzip -l "$jar" | grep -c '\.class$')
          echo "::notice title=Built jar::$jar - $(stat -c%s "$jar") bytes, $classes classes, sha256 $(sha256sum "$jar" | cut -c1-32)"

          if [ "$failures" != 0 ]; then
            echo "$failures check(s) failed"
            exit 1
          fi
          echo 'the jar is a real, reobfuscated Forge 1.12.2 mod jar'

      # The Actions artifact download goes through a host that is not reachable from every
      # environment, so the jar is also committed to release/ and can be picked up with a pull.
      - name: Publish the jar
        if: steps.build.outcome == 'success'
        run: |
          # reobfJar stamps the entries with the build time, so fall back to comparing the
          # content (entry names and CRCs) instead of the file bytes.
          fingerprint() { unzip -v "$1" | awk 'NR>3 {print $7, $8}' | sort; }

          mkdir -p release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          changed=0
          for built in build/libs/ScriptCraft-*.jar; do
            name=$(basename "$built")
            if git cat-file -e "HEAD:release/$name" 2>/dev/null; then
              git show "HEAD:release/$name" > /tmp/previous.jar
              if [ "$(fingerprint "$built")" != "$(fingerprint /tmp/previous.jar)" ]; then
                echo "$name changed"
                changed=1
              fi
            else
              echo "$name is new"
              changed=1
            fi
            cp "$built" "release/$name"
          done

          if [ "$changed" = 0 ]; then
            echo "release/ content is unchanged; nothing to publish"
            exit 0
          fi

          git add -f release
          git commit -m 'ci: built jar [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME} || true

      # Same JDK 8 and the same Nashorn the mod uses at runtime; runs after the jar
      # publication so a rig failure still leaves release/ updated, but still fails the job.
      - name: Offline verification rig
        run: |
          set +e
          ./dev-verify/verify.sh 2>&1 | tee ci-verify.log
          status=${PIPESTATUS[0]}
          javac -version 2>&1 | sed 's/^/::notice title=Rig toolchain::/'
          grep -E 'PASSED:' ci-verify.log | tail -1 | sed 's/^/::notice title=Rig result::/'
          exit $status

      # The Actions log endpoints are not reachable from every environment either. On failure
      # the logs are committed back to the branch so they can be read with a normal git pull.
      - name: Publish the build log
        if: failure() || steps.build.outcome == 'failure'
        run: |
          {
            echo "=== verify ($GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT) ==="
            tail -c 20000 ci-verify.log 2>/dev/null
            echo
            echo "=== build ==="
            tail -c 60000 ci-build.log 2>/dev/null
          } > ci-last-build.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ci-last-build.log
          git commit -m 'ci: build log [skip ci]' || true
          git push origin HEAD:${GITHUB_REF_NAME} || true

      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ScriptCraft-jar
          path: build/libs/ScriptCraft-*.jar
          if-no-files-found: error
