name: build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'

jobs:
  build:
    name: gradlew build (JDK 8)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Build
        id: build
        continue-on-error: true
        run: |
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee ci-build.log
          exit ${PIPESTATUS[0]}

      - name: List output
        if: always()
        run: ls -l build/libs || true

      # The Actions artifact download goes through a host that is not reachable from every
      # environment, so the jar is also committed to release/ and can be picked up with a pull.
      - name: Publish the jar
        if: steps.build.outcome == 'success'
        run: |
          # reobfJar stamps the entries with the build time, so fall back to comparing the
          # content (entry names and CRCs) instead of the file bytes.
          fingerprint() { unzip -v "$1" | awk 'NR>3 {print $7, $8}' | sort; }

          mkdir -p release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          changed=0
          for built in build/libs/ScriptCraft-*.jar; do
            name=$(basename "$built")
            if git cat-file -e "HEAD:release/$name" 2>/dev/null; then
              git show "HEAD:release/$name" > /tmp/previous.jar
              if [ "$(fingerprint "$built")" != "$(fingerprint /tmp/previous.jar)" ]; then
                echo "$name changed"
                changed=1
              fi
            else
              echo "$name is new"
              changed=1
            fi
            cp "$built" "release/$name"
          done

          if [ "$changed" = 0 ]; then
            echo "release/ content is unchanged; nothing to publish"
            exit 0
          fi

          git add -f release
          git commit -m 'ci: built jar [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME} || true

      # Same JDK 8 and the same Nashorn the mod uses at runtime; runs after the jar
      # publication so a rig failure still leaves release/ updated, but still fails the job.
      - name: Offline verification rig
        run: |
          set +e
          ./dev-verify/verify.sh 2>&1 | tee ci-verify.log
          status=${PIPESTATUS[0]}
          javac -version 2>&1 | sed 's/^/::notice title=Rig toolchain::/'
          grep -E 'PASSED:' ci-verify.log | tail -1 | sed 's/^/::notice title=Rig result::/'
          exit $status

      # The Actions log endpoints are not reachable from every environment either. On failure
      # the logs are committed back to the branch so they can be read with a normal git pull.
      - name: Publish the build log
        if: failure() || steps.build.outcome == 'failure'
        run: |
          {
            echo "=== verify ($GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT) ==="
            tail -c 20000 ci-verify.log 2>/dev/null
            echo
            echo "=== build ==="
            tail -c 60000 ci-build.log 2>/dev/null
          } > ci-last-build.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ci-last-build.log
          git commit -m 'ci: build log [skip ci]' || true
          git push origin HEAD:${GITHUB_REF_NAME} || true

      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ScriptCraft-jar
          path: build/libs/ScriptCraft-*.jar
          if-no-files-found: error
