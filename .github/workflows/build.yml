name: build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish build/libs as a GitHub release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'

jobs:
  build:
    name: gradlew build (JDK 8)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Build
        id: build
        continue-on-error: true
        run: |
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee ci-build.log
          exit ${PIPESTATUS[0]}

      - name: List output
        if: always()
        run: ls -l build/libs || true

      # Proves the file Gradle produced really is a reobfuscated Forge 1.12.2 mod jar and not
      # just something that happens to be named ScriptCraft-0.1.0.jar.
      # Proves the file Gradle produced really is a reobfuscated Forge 1.12.2 mod jar and not
      # just something that happens to be named ScriptCraft-0.1.0.jar. The dumps go to files
      # first: `javap ... | grep -q ...` under `set -o pipefail` can die of SIGPIPE, and javap 8
      # prints annotation values abbreviated (#7=e#8.#9) where javap 11 expands them, so the
      # checks below only look at things both versions print the same way.
      - name: Verify the built jar
        if: steps.build.outcome == 'success'
        run: |
          set -uo pipefail
          exec > >(tee -a ci-verify.log) 2>&1
          echo "javap: $(command -v javap) $(javap -version 2>&1 | head -1)"

          jar=build/libs/ScriptCraft-0.1.0.jar
          test -f "$jar" || { echo "no jar at $jar"; exit 1; }

          d=$(mktemp -d)
          unzip -l "$jar" > "$d/list.txt"
          unzip -p "$jar" META-INF/MANIFEST.MF > "$d/manifest.txt"
          unzip -p "$jar" mcmod.info > "$d/mcmod.txt"
          javap -verbose -cp "$jar" com.scriptcraft.ScriptCraft > "$d/mod.txt" 2>&1
          javap -verbose -cp "$jar" com.scriptcraft.client.ClientProxy > "$d/client.txt" 2>&1
          javap -c -p -cp "$jar" com.scriptcraft.api.PlayerApi > "$d/player.txt" 2>&1

          failures=0
          check() {
            if eval "$2" >/dev/null 2>&1; then
              echo "ok       $1"
            else
              echo "FAILED   $1"
              echo "::warning title=Jar check failed::$1"
              failures=$((failures + 1))
            fi
          }

          check 'manifest names the mod'            "grep -q 'Implementation-Title: ScriptCraft' $d/manifest.txt"
          check 'mcmod.info declares mcversion'     "grep -q mcversion $d/mcmod.txt && grep -q 1.12.2 $d/mcmod.txt"
          check 'bundled example is packaged'       "grep -q 'assets/scriptcraft/examples/example.js' $d/list.txt"
          check 'at least 50 classes'               "[ \$(grep -c '\.class$' $d/list.txt) -ge 50 ]"
          check 'class files are Java 8 (major 52)' "grep -q 'major version: 52' $d/mod.txt"
          check 'links against FML (@Mod)'          "grep -q 'net/minecraftforge/fml/common/Mod' $d/mod.txt"
          check 'client proxy is @SideOnly(CLIENT)' "grep -q SideOnly $d/client.txt && grep -q CLIENT $d/client.txt"
          check 'reobfuscated (SRG names present)'  "grep -qE 'func_[0-9a-z]+' $d/player.txt"

          echo "::notice title=Built jar::$jar - $(stat -c%s "$jar") bytes, $(grep -c '\.class$' "$d/list.txt") classes, sha256 $(sha256sum "$jar" | cut -c1-32)"

          if [ "$failures" != 0 ]; then
            echo "$failures check(s) failed; dumps follow"
            for f in client.txt mod.txt player.txt; do
              echo "--- $f ---"
              head -40 "$d/$f"
            done
            exit 1
          fi
          echo 'the jar is a real, reobfuscated Forge 1.12.2 mod jar'

      # The Actions artifact download goes through a host that is not reachable from every
      # environment, so the jar is also committed to release/ and can be picked up with a pull.
      - name: Publish the jar
        if: steps.build.outcome == 'success'
        run: |
          # reobfJar stamps the entries with the build time, so fall back to comparing the
          # content (entry names and CRCs) instead of the file bytes.
          fingerprint() { unzip -v "$1" | awk 'NR>3 {print $7, $8}' | sort; }

          mkdir -p release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          changed=0
          for built in build/libs/ScriptCraft-*.jar; do
            name=$(basename "$built")
            if git cat-file -e "HEAD:release/$name" 2>/dev/null; then
              git show "HEAD:release/$name" > /tmp/previous.jar
              if [ "$(fingerprint "$built")" != "$(fingerprint /tmp/previous.jar)" ]; then
                echo "$name changed"
                changed=1
              fi
            else
              echo "$name is new"
              changed=1
            fi
            cp "$built" "release/$name"
          done

          if [ "$changed" = 0 ]; then
            echo "release/ content is unchanged; nothing to publish"
            exit 0
          fi

          git add -f release
          git commit -m 'ci: built jar [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME} || true

      # Same JDK 8 and the same Nashorn the mod uses at runtime; runs after the jar
      # publication so a rig failure still leaves release/ updated, but still fails the job.
      - name: Offline verification rig
        run: |
          set +e
          ./dev-verify/verify.sh 2>&1 | tee ci-verify.log
          status=${PIPESTATUS[0]}
          javac -version 2>&1 | sed 's/^/::notice title=Rig toolchain::/'
          grep -E 'PASSED:' ci-verify.log | tail -1 | sed 's/^/::notice title=Rig result::/'
          exit $status

      # The Actions log endpoints are not reachable from every environment either. On failure
      # the logs are committed back to the branch so they can be read with a normal git pull.
      - name: Publish the build log
        if: failure() || steps.build.outcome == 'failure'
        run: |
          {
            echo "=== run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT ==="
            for f in ci-verify.log ci-build.log; do
              echo "--- $f ---"
              if [ -f "$f" ]; then tail -c 40000 "$f"; else echo '(missing)'; fi
            done
          } > ci-last-build.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ci-last-build.log
          git commit -m 'ci: build log [skip ci]' || true
          git push origin HEAD:${GITHUB_REF_NAME} || true

      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ScriptCraft-jar
          path: build/libs/ScriptCraft-*.jar
          if-no-files-found: error

      # Release assets are uploaded through uploads.github.com, which some environments cannot
      # reach; this step runs on the runner instead, so the release always gets its assets.
      - name: Publish the release
        if: steps.build.outcome == 'success' && github.event.inputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(grep -oE "version = '[0-9.]+'" build.gradle | head -1 | cut -d"'" -f2)
          tag="v$version"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" build/libs/ScriptCraft-*.jar \
            --title "ScriptCraft $version" \
            --target "${GITHUB_SHA}" \
            --notes-file RELEASE_NOTES.md
          gh release view "$tag" --json url,assets --jq '"release \(.url) assets: \([.assets[].name] | join(", "))"'
