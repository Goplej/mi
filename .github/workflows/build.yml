name: build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'

jobs:
  build:
    name: gradlew build (JDK 8)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Build
        id: build
        continue-on-error: true
        run: |
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee ci-build.log
          exit ${PIPESTATUS[0]}

      - name: List output
        if: always()
        run: ls -l build/libs || true

      # The Actions log endpoints are not reachable from every environment, so the
      # build log is committed back to the branch and can be read with a normal git pull.
      - name: Publish build log
        if: always()
        run: |
          if [ ! -f ci-build.log ]; then echo "no log produced" > ci-build.log; fi
          tail -c 90000 ci-build.log > ci-last-build.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ci-last-build.log
          git commit -m 'ci: build log [skip ci]' || true
          git push origin HEAD:${GITHUB_REF_NAME} || true

      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ScriptCraft-jar
          path: build/libs/ScriptCraft-*.jar
          if-no-files-found: error
