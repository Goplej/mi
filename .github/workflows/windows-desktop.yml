name: Windows desktop

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to attach the Windows ZIP to (leave blank to build only)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify
      - run: npm run desktop:pack
      - name: Archive the portable app
        shell: pwsh
        run: |
          $archive = 'Builds/GarageEmpire-windows-x64.zip'
          Compress-Archive -Path 'Builds/windows/GarageEmpire-win32-x64' -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  GarageEmpire-windows-x64.zip" | Set-Content -Path "$archive.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: GarageEmpire-windows-x64
          path: |
            Builds/GarageEmpire-windows-x64.zip
            Builds/GarageEmpire-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: GarageEmpire-windows-x64
          path: release-assets
      - name: Upload assets to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/GarageEmpire-windows-x64.zip release-assets/GarageEmpire-windows-x64.zip.sha256 --repo "$GITHUB_REPOSITORY" --clobber
